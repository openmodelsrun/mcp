id: harbor-cross-chain-report
name: Harbor Cross-Chain Report
description: >-
  A read-only MCP client for requesting cross-chain snapshots of 1–5 public EVM addresses. get_payment_quote fetches the live amount and destination. submit_paid_report submits transaction proof only after the payer independently chooses to make the direct 0.02 native USDC payment on Base and signs the report authorization. The service returns block heights, EIP-7702 delegation indicators, contract bytecode sizes, SHA-256 fingerprints, and explorer links for Ethereum, Base, Arbitrum One, and Polygon. It does not inspect balances, hold or move funds, handle private keys, or establish ownership or malicious intent. Always fetch a fresh quote; price and destination shown by the live API control.
author:
  name: Rocket Harbor
  github: Rocket-Harbor-420
repository: https://github.com/Rocket-Harbor-420/harbor-cross-chain-report-mcp
transport:
  - stdio
category: Security
tags:
  - blockchain
  - evm
  - mcp-server
  - onchain-analysis
  - base
  - usdc
created_at: "2026-09-28T05:23:51.000Z"
updated_at: "2026-09-28T05:23:51.000Z"
tools:
  - name: get_payment_quote
    description: >-
      Fetch the current quote, Base USDC contract, operator payment address, supported networks, and confirmation requirement. This read-only tool does not send payment. Optionally formats the authorization-message template locally for 1–5 addresses; those addresses are not sent to the quote endpoint.
    input_schema:
      type: object
      properties:
        addresses:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: Optional public EVM address batch to include in the signing-message template.
      additionalProperties: false
  - name: submit_paid_report
    description: >-
      Request the paid report after the payer has independently sent the exact quoted Base USDC transfer and signed the returned authorization message. Submits the transaction hash, payer address, 1–5 public EVM addresses, and signature. The server never sends or signs a payment; the signature authorizes only the report request.
    input_schema:
      type: object
      required:
        - txHash
        - payerAddress
        - addresses
        - signature
      properties:
        txHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
          description: Confirmed Base transaction hash for the direct USDC transfer.
        payerAddress:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: Address that sent the USDC and signs the report authorization.
        addresses:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: Public EVM addresses to inspect on Ethereum, Base, Arbitrum One, and Polygon.
        signature:
          type: string
          pattern: "^0x[0-9a-fA-F]{130}$"
          description: 65-byte personal_sign signature of the exact authorization message returned by get_payment_quote.
      additionalProperties: false
install:
  command: npx
  args:
    - "-y"
    - "github:Rocket-Harbor-420/harbor-cross-chain-report-mcp"
license: MIT
version: "0.1.0"
