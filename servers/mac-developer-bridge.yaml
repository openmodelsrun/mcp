id: mac-developer-bridge
name: Mac Developer Bridge
description: Local-first macOS MCP bridge that lets an existing ChatGPT conversation use the developer's actual Mac as its
  execution environment. It exposes arbitrary shell execution, unrestricted filesystem operations, real PTY sessions, background
  jobs, local auditing, and read-only stored Codex history. The bridge itself makes no model calls. It is intentionally not
  sandboxed and runs with the effective permissions of the macOS user, so it is only appropriate when explicit full-machine
  access is desired.
author:
  name: Alexander Rådahl Benz
  github: alexanderradahl
repository: https://github.com/alexanderradahl/mac-developer-bridge
transport:
- stdio
- http-streaming
category: Development
tags:
- chatgpt
- codex
- macos
- developer-tools
- local-first
- terminal
- pty
- filesystem
- automation
- mcp-server
created_at: '2026-08-15T16:05:04.000Z'
updated_at: '2026-08-15T18:05:00.000Z'
tools:
- name: bridge_status
  description: Inspect the host identity, runtime paths, permissions context, configured shell, audit log, and Codex executable.
    This is read-only.
  input_schema:
    type: object
    additionalProperties: false
- name: shell_exec
  description: Run an arbitrary command through the configured login shell with the full permissions of the macOS user running
    this bridge. Use for commands that finish within the requested timeout. This can read, modify, delete, deploy, access
    the network, or invoke other programs.
  input_schema:
    type: object
    properties:
      command:
        type: string
        minLength: 1
        description: Exact shell command to execute.
      cwd:
        type: string
        description: Working directory. Supports absolute paths, relative paths, and ~/ paths. Defaults to the user's home
          directory.
      env:
        type: object
        additionalProperties:
          type:
          - string
          - number
          - boolean
          - 'null'
        description: Environment overrides. Set a value to null to remove it.
      stdin:
        type: string
        description: Optional text to send to stdin.
      timeout_ms:
        type: integer
        minimum: 0
        maximum: 1800000
        default: 120000
        description: 0 disables the bridge timeout. Prefer shell_start for long-running services.
      max_output_bytes:
        type: integer
        minimum: 1024
        maximum: 64000000
        description: Maximum bytes captured separately from stdout and stderr.
    required:
    - command
    additionalProperties: false
- name: shell_start
  description: Start an arbitrary detached background command with full host permissions. Output is written to persistent
    log files and the job can be inspected or stopped later.
  input_schema:
    type: object
    properties:
      command:
        type: string
        minLength: 1
      cwd:
        type: string
      env:
        type: object
        additionalProperties:
          type:
          - string
          - number
          - boolean
          - 'null'
      label:
        type: string
        maxLength: 100
    required:
    - command
    additionalProperties: false
- name: shell_job_status
  description: Check whether a background job is running and return the tail of its stdout and stderr logs.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      max_log_bytes:
        type: integer
        minimum: 1024
        maximum: 8000000
        default: 100000
    required:
    - job_id
    additionalProperties: false
- name: shell_job_list
  description: List persistent background-job metadata and current running state.
  input_schema:
    type: object
    additionalProperties: false
- name: shell_job_kill
  description: Send a signal to the background job's process group. Defaults to SIGTERM.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      signal:
        type: string
        enum:
        - SIGTERM
        - SIGKILL
        - SIGINT
        - SIGHUP
        default: SIGTERM
    required:
    - job_id
    additionalProperties: false
- name: fs_read
  description: Read any file accessible to the macOS user. Supports byte ranges and text or base64 output.
  input_schema:
    type: object
    properties:
      path:
        type: string
      encoding:
        type: string
        enum:
        - utf8
        - base64
        default: utf8
      offset:
        type: integer
        minimum: 0
        default: 0
      max_bytes:
        type: integer
        minimum: 1
        maximum: 64000000
        default: 1000000
    required:
    - path
    additionalProperties: false
- name: fs_write
  description: Create, replace, or append to any file accessible to the macOS user. Parent directories can be created automatically.
    Replacement writes are atomic by default.
  input_schema:
    type: object
    properties:
      path:
        type: string
      content:
        type: string
      encoding:
        type: string
        enum:
        - utf8
        - base64
        default: utf8
      append:
        type: boolean
        default: false
      atomic:
        type: boolean
        default: true
      create_parents:
        type: boolean
        default: true
      mode:
        type: integer
        minimum: 0
        maximum: 4095
        description: Optional POSIX mode as a decimal integer, for example 420 for 0644.
    required:
    - path
    - content
    additionalProperties: false
- name: fs_list
  description: List a directory, optionally recursively, with type, size, mode, and timestamps. Symlinks are not followed
    during recursion.
  input_schema:
    type: object
    properties:
      path:
        type: string
      recursive:
        type: boolean
        default: false
      include_hidden:
        type: boolean
        default: true
      max_entries:
        type: integer
        minimum: 1
        maximum: 100000
        default: 5000
      max_depth:
        type: integer
        minimum: 0
        maximum: 100
        default: 10
    required:
    - path
    additionalProperties: false
- name: fs_stat
  description: Return lstat metadata for any accessible filesystem path, including symlink target when applicable.
  input_schema:
    type: object
    properties:
      path:
        type: string
    required:
    - path
    additionalProperties: false
- name: fs_manage
  description: 'Perform unrestricted filesystem operations: mkdir, remove, move, copy, chmod, or symlink. Remove is recursive
    when requested. These operations use the host user''s permissions.'
  input_schema:
    type: object
    properties:
      operation:
        type: string
        enum:
        - mkdir
        - remove
        - move
        - copy
        - chmod
        - symlink
      path:
        type: string
        description: Primary path or symlink path.
      destination:
        type: string
        description: Destination for move/copy, or target for symlink.
      recursive:
        type: boolean
        default: false
      force:
        type: boolean
        default: false
      mode:
        type: integer
        minimum: 0
        maximum: 4095
    required:
    - operation
    - path
    additionalProperties: false
- name: apply_patch
  description: Apply a unified diff using git apply in the specified working directory. This does not invoke a model and can
    modify any paths permitted by git apply and the host OS.
  input_schema:
    type: object
    properties:
      patch:
        type: string
        minLength: 1
      cwd:
        type: string
      check_only:
        type: boolean
        default: false
      reverse:
        type: boolean
        default: false
      three_way:
        type: boolean
        default: false
    required:
    - patch
    additionalProperties: false
- name: codex_thread_read
  description: Read a stored local Codex thread through codex app-server without resuming it or starting a model turn. Set
    include_turns to true for the full persisted history.
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
      include_turns:
        type: boolean
        default: true
      timeout_ms:
        type: integer
        minimum: 1000
        maximum: 120000
        default: 30000
    required:
    - thread_id
    additionalProperties: false
- name: codex_thread_list
  description: Page through stored local Codex threads without resuming them or starting model turns. Supports search, cwd,
    archived state, sorting, and cursor pagination.
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      cursor:
        type: string
      search_term:
        type: string
      cwd:
        type: string
      archived:
        type: boolean
      is_pinned:
        type: boolean
      use_state_db_only:
        type: boolean
        default: false
      model_providers:
        type: array
        items:
          type: string
      source_kinds:
        type: array
        items:
          type: string
          enum:
          - cli
          - vscode
          - exec
          - appServer
          - subAgent
          - subAgentReview
          - subAgentCompact
          - subAgentThreadSpawn
          - subAgentOther
          - unknown
      sort_key:
        type: string
        enum:
        - created_at
        - updated_at
        - recency_at
        default: recency_at
      sort_direction:
        type: string
        enum:
        - asc
        - desc
        default: desc
      timeout_ms:
        type: integer
        minimum: 1000
        maximum: 120000
        default: 30000
    additionalProperties: false
- name: codex_thread_turns_list
  description: Page a stored Codex thread's turns without resuming it or starting a model turn. Use items_view=full to recover
    complete persisted turn items when codex_thread_read is too large for one response.
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      cursor:
        type: string
      sort_direction:
        type: string
        enum:
        - asc
        - desc
        default: asc
      items_view:
        type: string
        enum:
        - notLoaded
        - summary
        - full
        default: full
      timeout_ms:
        type: integer
        minimum: 1000
        maximum: 120000
        default: 30000
    required:
    - thread_id
    additionalProperties: false
- name: audit_tail
  description: Return the tail of the bridge's local JSONL audit log. The default metadata mode redacts common token patterns
    and stores only an argument preview plus a hash.
  input_schema:
    type: object
    properties:
      max_bytes:
        type: integer
        minimum: 1024
        maximum: 8000000
        default: 200000
    additionalProperties: false
- name: pty_start
  description: 'Start a program on a real pseudo-terminal and keep it running as a session that can be written to, read from,
    resized, and signalled. Use this for anything that prompts or redraws: interactive authentication, sudo and ssh passphrase
    prompts, REPLs, test watchers, git rebase, and full-screen TUIs. ''command'' plus ''args'' is an argv vector, not a shell
    string; for a shell use command ''/bin/zsh'' with args [''-i'']. Sessions are in memory only and do not survive a bridge
    restart. Removing the full-access unlock file terminates every live session.'
  input_schema:
    type: object
    properties:
      command:
        type: string
        minLength: 1
        description: Executable to run. Absolute path, or a name resolved through PATH.
      args:
        type: array
        items:
          type: string
        maxItems: 256
        description: Argument vector. Not parsed by a shell.
      cwd:
        type: string
        description: Working directory. Supports absolute, relative, and ~/ paths. Defaults to the user's home directory.
      env:
        type: object
        additionalProperties:
          type:
          - string
          - number
          - boolean
          - 'null'
        maxProperties: 64
        description: Environment overrides. Set a value to null to remove it.
      cols:
        type: integer
        minimum: 20
        maximum: 500
        default: 120
      rows:
        type: integer
        minimum: 5
        maximum: 200
        default: 30
      term:
        type: string
        enum:
        - xterm-256color
        - xterm
        - vt100
        - dumb
        default: xterm-256color
        description: TERM for the child. Programs that call tput fail outright without it.
      idle_timeout_ms:
        type: integer
        minimum: 30000
        maximum: 3600000
        default: 900000
        description: Session is reclaimed after this long with no pty tool call against it. Output from the child does not
          count as activity.
      label:
        type: string
        maxLength: 100
    required:
    - command
    additionalProperties: false
- name: pty_read
  description: Read a byte range of a session's output. 'cursor' is an absolute byte offset, so the same cursor always returns
    the same bytes and 'next_cursor' continues without gap or overlap; a retried read never loses output. Reading a session
    that has already exited is not an error and is how final output is collected. ANSI escapes and carriage-return progress
    redraws are removed by default; disable both to see raw TUI bytes.
  input_schema:
    type: object
    properties:
      session_id:
        type: string
        minLength: 1
        maxLength: 128
      cursor:
        type: integer
        minimum: 0
        default: 0
        description: Absolute byte offset. Start at 0, then pass the previous next_cursor.
      max_bytes:
        type: integer
        minimum: 1024
        maximum: 1000000
        default: 65536
      strip_ansi:
        type: boolean
        default: true
      collapse_carriage_returns:
        type: boolean
        default: true
      wait_ms:
        type: integer
        minimum: 0
        maximum: 30000
        default: 0
        description: Wait up to this long for new output before returning. 0 returns immediately.
    required:
    - session_id
    additionalProperties: false
- name: pty_write
  description: 'Send bytes to the session''s terminal exactly as typed. End a line with \r to submit it. Control characters:
    \u0003 is Ctrl-C (interrupts only the foreground program), \u0004 is end-of-file, \u001a is Ctrl-Z, \u001b is Escape.
    Input is never echoed back by this tool; read it with pty_read. The written bytes are never recorded in the audit log,
    so passphrase prompts are safe to answer here. Line length limit: while the terminal is in canonical mode (the default,
    and what every interactive prompt uses), the line discipline DISCARDS an entire input line of 1024 bytes or more rather
    than truncating it, so a write that would build such a line is refused with PTY_WRITE_CANON_LIMIT instead of being reported
    as delivered. Bytes accumulate across calls until a \r or \n, so chunking a long line does not evade it. Send lines of
    at most 1023 bytes.'
  input_schema:
    type: object
    properties:
      session_id:
        type: string
        minLength: 1
        maxLength: 128
      data:
        type: string
        maxLength: 65536
    required:
    - session_id
    - data
    additionalProperties: false
- name: pty_resize
  description: Change the terminal window size and deliver SIGWINCH to the session, so full-screen programs redraw at the
    new geometry. The returned cols and rows are the kernel's own read-back of the window size, not the requested values;
    a resize that cannot be confirmed is reported as an error rather than as success.
  input_schema:
    type: object
    properties:
      session_id:
        type: string
        minLength: 1
        maxLength: 128
      cols:
        type: integer
        minimum: 20
        maximum: 500
      rows:
        type: integer
        minimum: 5
        maximum: 200
    required:
    - session_id
    - cols
    - rows
    additionalProperties: false
- name: pty_signal
  description: Send a signal to the session's entire process group, which includes the shell itself and every program it started.
    To interrupt only the foreground program and keep the shell alive, use pty_write with \u0003 instead. Signals are delivered
    by the pty helper to the session leader's group; the result reports whether delivery was confirmed.
  input_schema:
    type: object
    properties:
      session_id:
        type: string
        minLength: 1
        maxLength: 128
      signal:
        type: string
        enum:
        - INT
        - TERM
        - KILL
        - HUP
        - QUIT
        - USR1
        - USR2
        - WINCH
        - TSTP
        - CONT
    required:
    - session_id
    - signal
    additionalProperties: false
- name: pty_close
  description: 'End a session and reclaim it. Sends SIGTERM, waits for the grace period, then SIGKILL to the leader''s process
    group, then SIGKILL to anything still holding the session''s controlling terminal (interactive job control puts every
    background job — a plain ''cmd &'' — in its own process group, which a group kill does not reach; those pids are listed
    in ''ttyProcessesKilled''). ''leaderGroupGone'' reports the group check alone. ''containment_verified'' is true only when
    the group is gone AND nothing that shared the terminal survived; survivors are listed in ''uncontainedPids''. It can legitimately
    be false: a descendant that both called setsid() and detached from the terminal escapes both kills. Idempotent: closing
    an already-closed session reports its recorded outcome.'
  input_schema:
    type: object
    properties:
      session_id:
        type: string
        minLength: 1
        maxLength: 128
      force:
        type: boolean
        default: false
        description: Skip SIGTERM and the grace period.
      grace_ms:
        type: integer
        minimum: 0
        maximum: 10000
        default: 2000
    required:
    - session_id
    additionalProperties: false
