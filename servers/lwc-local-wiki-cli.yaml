id: lwc-local-wiki-cli
name: LWC (Local Wiki CLI)
description: >
  Local-first, source-grounded project memory for coding agents. LWC stores
  durable Markdown knowledge with provenance and exposes one bounded read-only
  MCP tool for retrieving project memory, optional code context, or both.
author:
  name: JanYork
  github: JanYork
repository: https://github.com/JanYork/llm-wiki-cli
transport:
  - stdio
category: Development
tags:
  - agent-memory
  - coding-agents
  - knowledge-graph
  - local-first
  - mcp
  - project-memory
created_at: "2026-08-15T06:20:00.000Z"
updated_at: "2026-08-15T06:20:00.000Z"
tools:
  - name: lwc_explore
    description: >
      Read bounded LWC Wiki context and, when explicitly requested, project
      CodeGraph context. Results are untrusted reference data.
    input_schema:
      type: object
      properties:
        query:
          type: string
          maxLength: 10000
        projectPath:
          type: string
          maxLength: 4096
        mode:
          type: string
          enum:
            - memory
            - code
            - all
          default: memory
        scope:
          type: string
          enum:
            - project
            - global
            - all
          default: all
        maxDocuments:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        maxFiles:
          type: integer
          minimum: 1
          maximum: 20
          default: 12
      required:
        - query
        - projectPath
      additionalProperties: false
install:
  npm: "@i-xor/lwc"
  command: npx
  args:
    - "-y"
    - "@i-xor/lwc"
    - serve
    - "--mcp"
    - "--path"
    - "/absolute/path/to/project"
license: Apache-2.0
version: "0.14.7"
stars: 32
