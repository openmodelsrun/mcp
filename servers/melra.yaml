id: melra
name: MELRA
description: >
  A local MCP execution runtime for AI agents. MELRA governs file, terminal,
  browser, desktop, memory, and HTTP tool actions with policy checks and scoped
  approvals, verifies declared outcomes, and records redacted durable receipts
  for recovery after interrupted calls. It exposes task and workflow tools over
  stdio and Streamable HTTP, with Unix-domain socket support on supported
  platforms. MELRA is alpha software and requires Node.js 22.13+ or 23.4+.
author:
  name: XAGI Labs
  github: XAGI-Lab
repository: https://github.com/XAGI-Lab/melra
transport:
  - stdio
  - http-streaming
category: Security
tags:
  - mcp
  - agent-runtime
  - security
  - policy
  - approvals
  - verification
  - recovery
  - workflows
  - local-first
  - ai-agents
  - mcp-security
  - durable-execution
created_at: "2026-10-16T09:41:46.000Z"
updated_at: "2026-10-20T17:40:56.000Z"
install:
  npm: "@melra/cli"
  command: npx
  args:
    - "-y"
    - "@melra/cli@alpha"
    - serve
license: Apache-2.0
version: "0.3.0-alpha.14"
