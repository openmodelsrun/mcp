id: neverapply
name: NeverApply
description: >
  NeverApply's hosted MCP server lets Claude, Cursor, Cline and other MCP clients
  search and match jobs, tailor resumes, answer screening questions, prepare for
  interviews, and apply to jobs with your approval. Remote Streamable HTTP endpoint
  at https://neverapply.co/mcp with OAuth 2.1 sign-in (PKCE and dynamic client
  registration), 15 tools. Docs: https://neverapply.co/features/mcp. The linked
  repository holds the public connection config and client plugins, not the hosted
  server implementation.
