id: clawdcall
name: ClawdCall MCP Server
description: >
  Gives AI agents a phone execution layer for consent-based outbound calls.
  Agents can create a ClawdCall account through phone verification, place an
  expected call with task-specific instructions, and retrieve the resulting
  transcript. Use it when an agent needs to complete a real-world phone task
  and return the conversation record to its workflow.
author:
  name: ClawdCall
  github: dialgoodian
repository: https://github.com/dialgoodian/clawdcall-mcp
transport:
  - stdio
  - http-streaming
category: Communication
tags:
  - clawdcall
  - ai-agents
  - telephony
  - voice
  - phone-calls
  - transcripts
  - workflow-automation
created_at: "2026-05-16T10:55:25.000Z"
updated_at: "2026-09-06T03:18:23.000Z"
tools:
  - name: send_signup_otp
    description: Send a phone verification OTP for ClawdCall signup without an API key.
    input_schema:
      type: object
      properties:
        email:
          type: string
          description: Email address for the new ClawdCall account.
        phone_number:
          type: string
          description: Human phone number to verify.
      required:
        - email
        - phone_number
  - name: verify_signup_otp
    description: Verify a ClawdCall signup OTP and receive account and API-key details.
    input_schema:
      type: object
      properties:
        email:
          type: string
          description: Email address used to request the OTP.
        phone_number:
          type: string
          description: Human phone number used for signup.
        otp:
          type: string
          description: OTP code received by the human.
      required:
        - email
        - phone_number
        - otp
  - name: place_outbound_call
    description: >
      Place an expected, consent-based outbound voice-agent call with a target
      number and task instructions.
    input_schema:
      type: object
      properties:
        target:
          type: string
          description: E.164 phone number to call.
        tasks:
          type: string
          description: Full voice-agent instruction set for the call.
        intro_message:
          type: string
          description: Optional opening line for the voice agent.
        openclaw_webhook_url:
          type: string
          description: Optional OpenClaw webhook URL for completion events.
        openclaw_webhook_authorization:
          type: string
          description: Optional Authorization header value for the OpenClaw webhook.
        conversation_id:
          type: string
          description: Optional OpenClaw conversation ID for event correlation.
        user_id:
          type: string
          description: Optional user ID for webhook correlation.
        context:
          type: string
          description: Optional extra context to include in the webhook payload.
      required:
        - target
        - tasks
  - name: get_call_transcript
    description: Fetch a ClawdCall transcript by call ID or campaign ID.
    input_schema:
      type: object
      properties:
        id:
          type: string
          description: Call ID or campaign ID returned by ClawdCall.
      required:
        - id
install:
  npm: clawdcall-mcp
  command: npx
  args:
    - "-y"
    - clawdcall-mcp
env_vars:
  - name: CLAWDCALL_API_KEY
    description: Required to place calls and retrieve transcripts; signup tools work without it.
    required: false
license: MIT
version: "0.1.0"
