id: microsoft-onedrive-sharepoint
name: Microsoft OneDrive and SharePoint MCP Server
description: >
  Microsoft's remote OneDrive and SharePoint MCP server exposes file tools from
  the ODSP MCP endpoint. Use it when agents need tenant-scoped discovery,
  retrieval, and workflow access over Microsoft 365 files stored in OneDrive
  and SharePoint.
author: {name: Microsoft, github: microsoft}
repository: https://github.com/bap-microsoft/MCP-Platform
transport: [http-streaming]
category: Filesystem
tags: [microsoft-365, onedrive, sharepoint, files, graph, productivity]
created_at: "2026-09-04T00:00:00.000Z"
updated_at: "2026-09-04T00:00:00.000Z"
install:
  type: remote
  url: https://agent365.svc.cloud.microsoft/agents/tenants/{tenant_id}/servers/mcp_ODSPRemoteServer
env_vars:
  - name: MICROSOFT_TENANT_ID
    description: Microsoft Entra tenant ID used to resolve the tenant-scoped remote MCP endpoint
    required: true
license: MIT
