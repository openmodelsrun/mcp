id: notfair-ads
name: NotFair Ads MCP
description: >
  Hosted OAuth MCP for AI agents working across Google Ads, Meta Ads, X Ads,
  LinkedIn Ads, Google Analytics 4, Google Search Console, and GoHighLevel.
  It exposes 282 tools for account discovery, cross-channel analysis, campaign
  management, creative workflows, analytics, CRM operations, approval-gated
  writes, change tracking, and guardrailed bulk mutations through one remote
  Streamable HTTP endpoint. Use it when an agent needs live marketing data and
  reviewable actions without installing or hosting a local MCP server.
